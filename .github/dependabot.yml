version: 2
updates:
  # uv ecosystem, not pip: uv reads pyproject.toml and uv.lock and updates
  # both in the same PR. With pip the lock fell behind and CI's
  # "uv sync --locked" failed on every bump.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
