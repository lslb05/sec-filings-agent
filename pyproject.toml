[project]
name = "sec-filings-agent"
version = "0.1.0"
description = "LangGraph agent that compares the Item 1A Risk Factors section of two 10-Ks and lists what changed, each change citing a passage that must appear literally in the source text."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Davi Liberato" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12",
    "langgraph>=0.2.60",
    "anthropic>=0.40",
    "openai>=1.50",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_filings_agent"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=sec_filings_agent --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

